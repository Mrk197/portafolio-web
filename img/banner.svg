<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A49"/>
      <stop offset="1" stop-color="#15213A"/>
    </linearGradient>
    <linearGradient id="naranja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA463"/>
      <stop offset="1" stop-color="#FF8C42"/>
    </linearGradient>
    <pattern id="puntos" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Fondo azul marino (lado izquierdo despejado para texto) -->
  <rect width="1920" height="800" fill="url(#fondo)"/>

  <!-- Bloque azul más claro en diagonal -->
  <path d="M1180 0 H1920 V800 H900 Z" fill="#22355C" fill-opacity="0.55"/>

  <!-- Círculo naranja principal -->
  <circle cx="1560" cy="400" r="230" fill="url(#naranja)"/>

  <!-- Anillos finos -->
  <circle cx="1560" cy="400" r="300" fill="none" stroke="#FF8C42" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1560" cy="400" r="380" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Rejilla de puntos -->
  <rect x="1180" y="80" width="200" height="170" fill="url(#puntos)"/>
  <rect x="1700" y="590" width="170" height="140" fill="url(#puntos)"/>

  <!-- Acentos geométricos -->
  <rect x="1270" y="560" width="90" height="90" rx="14" fill="none" stroke="#FF8C42" stroke-width="3" transform="rotate(18 1315 605)"/>
  <circle cx="1830" cy="150" r="14" fill="#FF8C42"/>
  <circle cx="1150" cy="690" r="8" fill="#FF8C42" fill-opacity="0.8"/>

  <!-- Líneas diagonales -->
  <g stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2">
    <line x1="1060" y1="800" x2="1340" y2="520"/>
    <line x1="1100" y1="800" x2="1380" y2="520"/>
    <line x1="1140" y1="800" x2="1420" y2="520"/>
  </g>
</svg>
